<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi aur VDesi Ai</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- marked.js for Markdown rendering of bot replies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ==========================================================================
     THEME / CUSTOMIZATION VARIABLES
     Change anything here and the whole app re-skins itself.
     Theme: "Desi aur VDesi Ai" — a warm, Indian-inspired light theme.
       - Primary   = Marigold / Saffron  (festive, energetic — the "desi" warmth)
       - Secondary = Peacock Green/Teal  (accent, calm counterbalance)
       - Background= Warm Ivory          (light, soft, not clinical white)
     ========================================================================== */
        :root {
            --theme-mode: light;
            --color-primary: #410a33;
            /* marigold / saffron orange */
            --color-primary-dark: #f0ebe9;
            --color-secondary: #2e29a7;
            /* peacock green accent */
            --color-secondary-light: #094427;
            --color-background: #e8e3de;
            /* warm ivory */
            --color-surface: #14d4de;
            --color-text: #2B1B12;
            /* deep warm brown, not pure black */
            --color-text-muted: #8A7566;
            --color-border: #F0DFC8;

            --font-family: 'Poppins', sans-serif;
            --font-size-base: 15px;

            --border-radius: 24px;
            --chat-max-width: 480px;
            --bubble-style: pill;
            /* rounded, playful pill bubbles */

            --shadow-soft: 0 4px 20px rgba(232, 89, 12, 0.08);
            --shadow-header: 0 2px 12px rgba(43, 27, 18, 0.06);
        }

        /*
    --layout-style concept (comment-only, for future tweaking):
    The app is a single centered column, capped at --chat-max-width, so it
    reads as a native "app" on desktop (like a phone mock-up) and expands
    to fill the viewport on mobile. Header is sticky at the top using
    --color-surface + --shadow-header. Bubbles use --bubble-style: pill,
    meaning very large --border-radius values (999px) rather than the
    boxier --border-radius used for cards/inputs. Every spacing unit
    scales off --font-size-base so bumping that one variable rescales
    the whole UI proportionally.
  */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--color-background);
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            color: var(--color-text);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: stretch;
            min-height: 100vh;
        }

        /* Scrollbar theming */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            opacity: 0.4;
            border-radius: 8px;
        }

        .app {
            width: 100%;
            max-width: var(--chat-max-width);
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--color-background);
            position: relative;
        }

        /* ---------------- Header ---------------- */
        .header {
            background: var(--color-surface);
            box-shadow: var(--shadow-header);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-emoji {
            font-size: 28px;
            line-height: 1;
        }

        .header h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: 0.2px;
        }

        .header p {
            margin: 0;
            font-size: 12.5px;
            color: var(--color-text-muted);
            font-weight: 400;
        }

        .clear-btn {
            background: var(--color-secondary-light);
            color: var(--color-secondary);
            border: none;
            padding: 8px 14px;
            border-radius: 999px;
            font-family: var(--font-family);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .clear-btn:hover {
            background: var(--color-secondary);
            color: #fff;
        }

        /* ---------------- Chat thread ---------------- */
        .chat-thread {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-row {
            display: flex;
            max-width: 100%;
        }

        .msg-row.user {
            justify-content: flex-end;
        }

        .msg-row.bot {
            justify-content: flex-start;
        }

        .bubble {
            padding: 11px 18px;
            line-height: 1.5;
            font-size: var(--font-size-base);
            max-width: 78%;
            word-wrap: break-word;
            box-shadow: var(--shadow-soft);
            animation: pop-in 0.18s ease;
        }

        /* --bubble-style: pill -> very rounded, playful bubbles */
        .bubble {
            border-radius: 999px;
            padding: 12px 20px;
        }

        /* Long / multi-line bot messages (with lists, headings) need softer
     corners than a true pill so content doesn't look squeezed */
        .bubble.multiline {
            border-radius: var(--border-radius);
        }

        .msg-row.user .bubble {
            background: var(--color-primary);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .msg-row.bot .bubble {
            background: var(--color-surface);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-bottom-left-radius: 6px;
        }

        .bubble p {
            margin: 0 0 8px 0;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .bubble ul,
        .bubble ol {
            margin: 6px 0;
            padding-left: 20px;
        }

        .bubble code {
            background: rgba(0, 0, 0, 0.06);
            padding: 1px 5px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .msg-row.user .bubble code {
            background: rgba(255, 255, 255, 0.2);
        }

        .bubble strong {
            color: var(--color-primary);
        }

        .msg-row.user .bubble strong {
            color: #fff;
        }

        @keyframes pop-in {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Typing indicator */
        .typing-bubble {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 14px 20px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--color-primary);
            opacity: 0.5;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* Error message styling */
        .msg-row.error .bubble {
            background: #FDECEA;
            border: 1px solid #F5C2BE;
            color: #A83A2E;
            border-radius: var(--border-radius);
        }

        /* ---------------- Input bar ---------------- */
        .input-bar {
            display: flex;
            gap: 10px;
            padding: 14px 16px;
            background: var(--color-surface);
            box-shadow: 0 -2px 12px rgba(43, 27, 18, 0.05);
        }

        .input-bar textarea {
            flex: 1;
            resize: none;
            border: 1px solid var(--color-border);
            background: var(--color-background);
            border-radius: 999px;
            padding: 12px 18px;
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            color: var(--color-text);
            outline: none;
            max-height: 100px;
            line-height: 1.4;
            transition: border-color 0.15s ease;
        }

        .input-bar textarea:focus {
            border-color: var(--color-primary);
        }

        .send-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .send-btn:hover {
            background: var(--color-primary-dark);
        }

        .send-btn:active {
            transform: scale(0.93);
        }

        .send-btn:disabled {
            background: var(--color-text-muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ---------------- Responsive ---------------- */
        @media (max-width: 520px) {
            .app {
                max-width: 100%;
            }

            .bubble {
                max-width: 85%;
            }

            .header {
                padding: 14px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- Header -->
        <div class="header">
            <div class="header-logo">
                <span class="header-emoji">🪔</span>
                <div class="header-titles">
                    <h1>Desi aur VDesi Ai</h1>
                    <p>Your dost for desi vibes &amp; videsi smarts ✨</p>
                </div>
            </div>
            <button class="clear-btn" id="clearBtn" title="Clear chat">Clear chat</button>
        </div>

        <!-- Chat thread -->
        <div class="chat-thread" id="chatThread"></div>

        <!-- Input bar -->
        <div class="input-bar">
            <textarea id="userInput" rows="1" placeholder="Type a message... (Enter to send)"></textarea>
            <button class="send-btn" id="sendBtn" title="Send">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 20L21 12L3 4V10L17 12L3 14V20Z" fill="currentColor" />
                </svg>
            </button>
        </div>

    </div>

    <script>
        // 🔑 Paste your Gemini API key below. Get one at https://aistudio.google.com/apikey
        // NOTE: This key is embedded directly in the page source on purpose (per app spec),
        // so it will be visible to anyone who views the page source. That's expected and
        // fine for local/personal use only — do NOT deploy this publicly with a real key.
        const API_KEY = "PASTE_YOUR_API_KEY_HERE";

        // Strictly use the Gemini 3.6 endpoint only, as required.
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent";

        // ---------------------------------------------------------------------
        // Persona / system instruction for "Desi aur VDesi Ai"
        // A warm, friendly Indian-flavored assistant that blends "desi" (local/
        // Indian) warmth with "videsi" (foreign/global) knowledge — casual
        // Hinglish sprinkled in, culturally aware, encouraging, uses the
        // occasional emoji, never preachy.
        // ---------------------------------------------------------------------
        const SYSTEM_INSTRUCTION = {
            parts: [{
                text: `You are "Desi aur VDesi Ai" — a warm, friendly, culturally-aware AI companion.
Your personality:
- You blend "desi" warmth (Indian culture, festivals, food, family values, casual Hinglish phrases like "arre wah", "bilkul", "chalo", "matlab") with "videsi" (global/western) knowledge and perspective.
- You are chatty, encouraging, and never condescending — like a smart, well-travelled friend (dost) who happens to know everything.
- Default to friendly English with light, natural Hinglish sprinkled in where it fits (not forced, not in every sentence).
- Use emojis occasionally and tastefully (not in every message).
- Keep replies well-formatted with Markdown (bold, bullet points) when helpful, but keep them concise unless asked for depth.
- You're helpful with anything: everyday advice, tech, studies, recipes, travel, career, or just casual chat.
Always stay warm, respectful, and genuinely helpful.`
            }]
        };

        const OPENING_GREETING = "Namaste! 🙏 Main hoon **Desi aur VDesi Ai** — your dost for everything from ghar ki baatein to duniya ki khabrein. Kya chal raha hai aaj? Ask me anything!";

        // Conversation history sent to the API — array of {role, parts}
        // role is either "user" or "model"
        let conversationHistory = [];

        // ---------------- DOM references ----------------
        const chatThread = document.getElementById('chatThread');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        // ---------------- Helpers ----------------

        // Render a message bubble into the thread.
        // sender: 'user' | 'bot' | 'error'
        function renderMessage(sender, rawText) {
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (sender === 'bot') {
                // Render markdown for bot messages (bold, lists, code, etc.)
                bubble.innerHTML = marked.parse(rawText);
                if (rawText.includes('\n') || rawText.length > 80) {
                    bubble.classList.add('multiline');
                }
            } else {
                // Plain text for user messages / errors (no markdown parsing needed)
                bubble.textContent = rawText;
            }

            row.appendChild(bubble);
            chatThread.appendChild(row);
            scrollToBottom();
            return row;
        }

        function scrollToBottom() {
            chatThread.scrollTop = chatThread.scrollHeight;
        }

        // Shows an animated "typing..." bubble, returns the row so it can be removed later.
        function showTypingIndicator() {
            const row = document.createElement('div');
            row.className = 'msg-row bot';
            row.id = 'typingRow';

            const bubble = document.createElement('div');
            bubble.className = 'bubble typing-bubble';
            bubble.innerHTML = `
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    `;

            row.appendChild(bubble);
            chatThread.appendChild(row);
            scrollToBottom();
            return row;
        }

        function removeTypingIndicator() {
            const row = document.getElementById('typingRow');
            if (row) row.remove();
        }

        // Auto-resize the textarea as the user types (up to CSS max-height)
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
        });

        // Send on Enter (without Shift, which allows newline)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        clearBtn.addEventListener('click', () => {
            conversationHistory = [];
            chatThread.innerHTML = '';
            renderMessage('bot', OPENING_GREETING);
        });

        // ---------------- Core send / API call logic ----------------
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Show user's message immediately
            renderMessage('user', text);
            conversationHistory.push({ role: 'user', parts: [{ text }] });

            // Reset input box
            userInput.value = '';
            userInput.style.height = 'auto';
            setSendingState(true);

            const typingRow = showTypingIndicator();

            try {
                const replyText = await callGeminiAPI();
                removeTypingIndicator();
                renderMessage('bot', replyText);
                conversationHistory.push({ role: 'model', parts: [{ text: replyText }] });
            } catch (err) {
                removeTypingIndicator();
                // Handle and display errors gracefully as a chat message, not an alert
                let friendlyMsg = "Arre yaar, something went wrong. 😕 ";
                if (err && err.message && err.message.includes('API key')) {
                    friendlyMsg += "Looks like the API key isn't set up correctly. Please check the API_KEY constant at the top of the script.";
                } else if (err && err.message && /network|fetch/i.test(err.message)) {
                    friendlyMsg += "Network issue — check your internet connection and try again.";
                } else {
                    friendlyMsg += `Details: ${err && err.message ? err.message : 'Unknown error.'}`;
                }
                renderMessage('error', friendlyMsg);
            } finally {
                setSendingState(false);
            }
        }

        function setSendingState(isSending) {
            sendBtn.disabled = isSending;
            userInput.disabled = isSending;
        }

        async function callGeminiAPI() {
            if (!API_KEY || API_KEY === "PASTE_YOUR_API_KEY_HERE") {
                throw new Error("API key is missing. Please paste your Gemini API key into the API_KEY constant.");
            }

            const requestBody = {
                contents: conversationHistory,
                system_instruction: SYSTEM_INSTRUCTION
            };

            let response;
            try {
                response = await fetch(`${API_URL}?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
            } catch (networkErr) {
                throw new Error("Network error — could not reach the API.");
            }

            if (!response.ok) {
                let errText = `API request failed (status ${response.status}).`;
                try {
                    const errJson = await response.json();
                    if (errJson && errJson.error && errJson.error.message) {
                        errText = errJson.error.message;
                    }
                } catch (_) { /* ignore parse failure, use default message */ }

                if (response.status === 400 || response.status === 403) {
                    throw new Error(`Invalid API key or request. ${errText}`);
                }
                throw new Error(errText);
            }

            const data = await response.json();

            const candidate = data && data.candidates && data.candidates[0];
            const partText = candidate &&
                candidate.content &&
                candidate.content.parts &&
                candidate.content.parts.map(p => p.text || '').join('');

            if (!partText) {
                throw new Error("Received an empty response from the API.");
            }

            return partText;
        }

        // ---------------- Init ----------------
        renderMessage('bot', OPENING_GREETING);
        userInput.focus();
    </script>

</body>

</html>
