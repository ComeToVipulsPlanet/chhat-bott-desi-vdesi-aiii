<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desi & Vdesi Ai</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown parser so bot replies with bold/lists render properly -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ============================================
     THEME VARIABLES — change these to reskin the
     whole app. Every element below pulls its
     colors/fonts/spacing from these variables.
     ============================================ */
        :root {
            --theme-mode: light;
            --color-primary: #2E9DF7;
            --color-secondary: #FFD400;
            --color-background: #F5FBFF;
            --color-text: #1f2937;
            --color-bubble-user: var(--color-primary);
            --color-bubble-bot: #ffffff;
            --font-family: 'Poppins', sans-serif;
            --font-size-base: 15px;
            --border-radius: 24px;
            --chat-max-width: 480px;
            --bubble-style: pill;
        }

        /* --layout-style concept:
     - Desktop (>600px): centered card, max-width var(--chat-max-width), full viewport height minus margin.
     - Mobile (<=600px): app fills the full screen edge-to-edge, header becomes a fixed top bar.
     - Bubble radius, spacing, and colors all scale from the same variables so the
       whole layout can be reskinned by editing :root only. */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            background: var(--color-background);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .chat-app {
            width: 100%;
            max-width: var(--chat-max-width);
            height: 90vh;
            max-height: 720px;
            background: #ffffff;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: var(--color-primary);
            color: #fff;
            padding: 18px 20px;
            text-align: center;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .chat-header p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Message thread */
        .chat-thread {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--color-background);
        }

        .chat-thread::-webkit-scrollbar {
            width: 6px;
        }

        .chat-thread::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }

        .msg {
            max-width: 78%;
            padding: 10px 16px;
            line-height: 1.4;
            word-wrap: break-word;
            border-radius: var(--border-radius);
            font-size: var(--font-size-base);
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            background: var(--color-bubble-user);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--color-bubble-bot);
            color: var(--color-text);
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 6px;
        }

        .msg.error {
            align-self: center;
            background: #ffe5e5;
            color: #b91c1c;
            border-radius: 12px;
            font-size: 13px;
        }

        .msg p {
            margin: 0 0 6px;
        }

        .msg p:last-child {
            margin-bottom: 0;
        }

        .msg ul,
        .msg ol {
            margin: 4px 0;
            padding-left: 20px;
        }

        .typing {
            align-self: flex-start;
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--color-bubble-bot);
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: var(--color-primary);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* Input area */
        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #eee;
            background: #fff;
        }

        #userInput {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 10px 16px;
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            outline: none;
        }

        #userInput:focus {
            border-color: var(--color-primary);
        }

        #sendBtn,
        #clearBtn {
            border: none;
            cursor: pointer;
            font-family: var(--font-family);
            font-weight: 600;
        }

        #sendBtn {
            background: var(--color-primary);
            color: #fff;
            padding: 10px 18px;
            border-radius: var(--border-radius);
        }

        #sendBtn:hover {
            opacity: 0.9;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-header-actions {
            position: absolute;
            top: 14px;
            right: 14px;
        }

        #clearBtn {
            background: var(--color-secondary);
            color: #1f2937;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
        }

        .chat-header {
            position: relative;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="chat-app">
        <div class="chat-header">
            <h1>Desi & Vdesi Ai</h1>
            <p>Your friendly desi-style chat buddy 🌶️</p>
            <div class="chat-header-actions">
                <button id="clearBtn">Clear chat</button>
            </div>
        </div>

        <div class="chat-thread" id="chatThread"></div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // ============================================
        // Persona / system instruction
        // ============================================
        const SYSTEM_PROMPT = `You are Desi & Vdesi Ai, a warm, witty chatbot with a fun desi-flavored
personality. You mix friendliness with a bit of playful Hinglish/desi humor where natural, but
you always stay clear and helpful. Keep replies concise, conversational, and easy to read. Use
markdown formatting (bold, bullet lists) when it helps clarity.`;

        const OPENING_GREETING = "Arre hello! 👋 I'm Desi & Vdesi Ai — your friendly desi-style chat buddy. Kya haal hai? Ask me anything!";

        // Conversation history sent to the API each time, for context
        let conversationHistory = [];

        const chatThread = document.getElementById('chatThread');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        function addMessage(text, role) {
            const bubble = document.createElement('div');
            bubble.className = 'msg ' + role;
            bubble.innerHTML = (role === 'error') ? text : marked.parse(text);
            chatThread.appendChild(bubble);
            chatThread.scrollTop = chatThread.scrollHeight;
            return bubble;
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatThread.appendChild(typing);
            chatThread.scrollTop = chatThread.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // ============================================
        // Sends the message to our own secure serverless
        // endpoint (/api/chat) instead of calling Gemini
        // directly. The API key lives only on the server.
        // ============================================
        async function sendMessage(userText) {
            conversationHistory.push({ role: "user", parts: [{ text: userText }] });

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: conversationHistory,
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
                    })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Something went wrong talking to the server.');
                }

                const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text
                    || "Hmm, I didn't get a proper reply. Try again?";

                conversationHistory.push({ role: "model", parts: [{ text: botReply }] });
                return { ok: true, text: botReply };
            } catch (err) {
                return { ok: false, text: err.message };
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            const result = await sendMessage(text);
            hideTyping();

            if (result.ok) {
                addMessage(result.text, 'bot');
            } else {
                addMessage('⚠️ ' + result.text, 'error');
            }
            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        clearBtn.addEventListener('click', () => {
            conversationHistory = [];
            chatThread.innerHTML = '';
            addMessage(OPENING_GREETING, 'bot');
        });

        // Opening greeting on load
        addMessage(OPENING_GREETING, 'bot');
    </script>

</body>

</html>
